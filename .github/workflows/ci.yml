name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Integration tests
        run: xvfb-run -a npm run test:integration
      - name: Package
        run: npx vsce package --out rinex-viewer.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: rinex-viewer.vsix
